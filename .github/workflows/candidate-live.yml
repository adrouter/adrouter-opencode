name: Verify exact candidate live

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable candidate tag to verify
        required: true
        type: string

permissions: {}

concurrency:
  group: candidate-live-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  candidate-live:
    runs-on: ubuntu-latest
    environment: adrouter-staging
    permissions:
      contents: read
    steps:
      - name: Refuse verification outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouter-opencode"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate source and public alias
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/adrouter-empty-npmrc
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          expected="v$(node -p "require('./release-manifest.json').version")"
          test "${CANDIDATE_TAG}" = "${expected}"
          git rev-parse --verify "${CANDIDATE_TAG}^{commit}"
          git diff --quiet "${CANDIDATE_TAG}^{commit}" HEAD -- src package.json bun.lock release-manifest.json
          version="${CANDIDATE_TAG#v}"
          test "$(npm view @adrouter/opencode dist-tags.candidate)" = "${version}"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Authenticated exact-candidate execution in OpenCode 1.18.31
        env:
          ADROUTER_INTEGRATION_API_KEY: ${{ secrets.ADROUTER_STAGING_INTEGRATION_API_KEY }}
          ADROUTER_INTEGRATION_API_URL: https://api-staging.adrouter.co
          ADROUTER_SMOKE_REGISTRY: "true"
          ADROUTER_SMOKE_LIVE: "true"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/adrouter-empty-npmrc
        run: |
          ADROUTER_SMOKE_OPENCODE_VERSION="$(bun -e 'console.log(require("./package.json").devDependencies["@opencode-ai/plugin"])')"
          export ADROUTER_SMOKE_OPENCODE_VERSION
          bun run plugin:check
