name: Stage tagged release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-tag-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    environment: adrouter-staging
    permissions:
      contents: write
    steps:
      - name: Refuse release operations outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouter-opencode"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - name: Authenticated staging canaries
        env:
          ADROUTER_API_KEY: ${{ secrets.ADROUTER_STAGING_API_KEY }}
        run: bun scripts/staging-canary.ts
      - name: Build and record the immutable release artifact
        run: |
          mkdir release-assets
          bun pm pack --destination release-assets
          bun scripts/npm-release.ts create release-assets "${GITHUB_REF_NAME}"
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*.tgz
          release-assets/SHA256SUMS
          release-assets/npm-artifacts.json
          --draft
          --prerelease
          --title "${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
