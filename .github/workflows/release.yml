name: Prepare release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - run: bun scripts/opencode-model-check.ts
      - name: Authenticated staging canaries
        env:
          ADROUTER_API_KEY: ${{ secrets.ADROUTER_STAGING_API_KEY }}
        run: bun scripts/staging-canary.ts
      - name: Build immutable release artifact
        run: |
          mkdir release-artifacts
          bun pm pack --destination release-artifacts
          cd release-artifacts
          sha256sum *.tgz > SHA256SUMS
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-artifacts/*.tgz
          release-artifacts/SHA256SUMS
          --draft
          --prerelease
          --generate-notes
          --verify-tag
