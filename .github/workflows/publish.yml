name: Promote staged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable v* release tag to promote
        required: true
        type: string
      phase:
        description: Publish the candidate or finalize npm and GitHub
        required: true
        type: choice
        options:
          - publish-candidate
          - finalize-release

permissions: {}

concurrency:
  group: promote-opencode
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      opencode-versions: ${{ steps.release.outputs.opencode-versions }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Read the tagged OpenCode compatibility matrix
        run: |
          versions=$(node -p "JSON.stringify(require('./release-manifest.json').npm.opencodeVersions)")
          echo "opencode-versions=${versions}" >> "${GITHUB_OUTPUT}"

  verify-and-publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # GitHub's workflow token needs write scope to enumerate draft release assets.
      contents: write
      id-token: write
    steps:
      - name: Refuse release operations outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouter-opencode"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin an OIDC-capable npm CLI
        run: npm install --global npm@11.12.1
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - name: Checkout the protected release verifier from the workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-verifier-source
          sparse-checkout: |
            package.json
            release-manifest.json
            scripts/npm-release.ts
            scripts/release-policy.ts
            scripts/release-registry.ts
          persist-credentials: false
      - name: Download the recorded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "${{ inputs.tag }}" \
            --pattern "*.tgz" \
            --pattern "SHA256SUMS" \
            --pattern "npm-artifacts.json" \
            --dir release-assets
      - run: bun release-verifier-source/scripts/npm-release.ts verify release-assets "${{ inputs.tag }}"
      - name: Publish the exact tarball under candidate with npm OIDC
        if: ${{ inputs.phase == 'publish-candidate' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun release-verifier-source/scripts/npm-release.ts publish release-assets "${{ inputs.tag }}"
      - name: Verify candidate publication
        if: ${{ inputs.phase == 'publish-candidate' }}
        run: >-
          bun release-verifier-source/scripts/npm-release.ts registry
          release-assets/npm-artifacts.json candidate
      - name: Verify resumable publication
        if: ${{ inputs.phase == 'finalize-release' }}
        run: >-
          bun release-verifier-source/scripts/npm-release.ts registry
          release-assets/npm-artifacts.json resumable

  registry-install:
    name: registry-${{ matrix.os }}-opencode-${{ matrix.opencode }}
    needs:
      - release-metadata
      - verify-and-publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        opencode: ${{ fromJSON(needs.release-metadata.outputs.opencode-versions) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Checkout the protected release verifier from the workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-verifier-source
          sparse-checkout: |
            package.json
            release-manifest.json
            scripts/npm-release.ts
            scripts/release-policy.ts
            scripts/release-registry.ts
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Install the registry candidate and verify provider discovery
        env:
          ADROUTER_SMOKE_OPENCODE_VERSION: ${{ matrix.opencode }}
          ADROUTER_SMOKE_REGISTRY: "true"
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/adrouter-empty-npmrc
        run: bun run plugin:check

  candidate-live:
    if: ${{ inputs.phase == 'publish-candidate' }}
    needs: registry-install
    runs-on: ubuntu-latest
    environment: adrouter-staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Authenticated exact-candidate execution in the latest qualified OpenCode
        env:
          ADROUTER_INTEGRATION_API_KEY: ${{ secrets.ADROUTER_STAGING_INTEGRATION_API_KEY }}
          ADROUTER_INTEGRATION_API_URL: https://api-staging.adrouter.co
          ADROUTER_SMOKE_REGISTRY: "true"
          ADROUTER_SMOKE_LIVE: "true"
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/adrouter-empty-npmrc
        run: |
          export ADROUTER_SMOKE_OPENCODE_VERSION="$(bun -e 'console.log(require("./package.json").devDependencies["@opencode-ai/plugin"])')"
          bun run plugin:check

  finalize-npm:
    if: ${{ inputs.phase == 'finalize-release' }}
    needs:
      - verify-and-publish
      - registry-install
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # Draft release assets are not visible to a read-only workflow token.
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin npm used for dist-tag promotion
        run: npm install --global npm@11.12.1
      - name: Checkout the protected release verifier from the workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: release-verifier-source
          sparse-checkout: |
            package.json
            release-manifest.json
            scripts/npm-release.ts
            scripts/release-policy.ts
            scripts/release-registry.ts
          persist-credentials: false
      - name: Download the recorded artifact manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --pattern "npm-artifacts.json" --dir .
      - name: Promote final tags, remove candidate, and deprecate when configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun release-verifier-source/scripts/npm-release.ts promote npm-artifacts.json

  publish-github:
    if: ${{ inputs.phase == 'finalize-release' }}
    needs: finalize-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse publication outside the canonical repository
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
        run: test "${ACTUAL_REPOSITORY}" = "adrouter/adrouter-opencode"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Publish the GitHub release and mark a superseded release when configured
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$(node -p "require('./release-manifest.json').release.githubPrerelease")
          gh release edit "${{ inputs.tag }}" \
            --repo adrouter/adrouter-opencode \
            --draft=false \
            --prerelease="${prerelease}"

          supersedes=$(node -p "require('./release-manifest.json').release.supersedes ?? ''")
          if [ -n "${supersedes}" ]; then
            gh release edit "v${supersedes}" --repo adrouter/adrouter-opencode \
              --title "WITHDRAWN — v${supersedes}" \
              --notes "Superseded by ${{ inputs.tag }}. Install @adrouter/opencode@beta."
          fi
